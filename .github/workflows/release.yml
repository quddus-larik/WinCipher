name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_INCREMENTAL: 0

jobs:
  release:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Verify tag matches app version
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}" -replace '^v',''
          $tauri = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $pkg = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($version -ne $tauri -or $version -ne $pkg) {
            throw "Tag v$version does not match tauri.conf.json ($tauri) or package.json ($pkg)."
          }

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and sign Tauri app
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        # Remove "--bundles nsis" if you still want .msi files built and uploaded
        run: pnpm tauri build --bundles nsis

      - name: Generate latest.json
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}" -replace '^v',''
          $exe = Get-ChildItem src-tauri/target/release/bundle/nsis/*-setup.exe |
                 Select-Object -First 1
          if (-not $exe) {
            throw "No NSIS installer found in src-tauri/target/release/bundle/nsis."
          }
          $signature = (Get-Content "$($exe.FullName).sig" -Raw).Trim()
          $latest = [ordered]@{
            version = $version
            notes = "WinCipher $version"
            pub_date = [DateTime]::UtcNow.ToString("yyyy-MM-ddTHH:mm:ssZ")
            platforms = [ordered]@{
              "windows-x86_64" = [ordered]@{
                url = "https://github.com/${{ github.repository }}/releases/download/v$version/$($exe.Name)"
                signature = $signature
              }
            }
          }
          $latest | ConvertTo-Json -Depth 6 | Set-Content latest.json -Encoding utf8

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          name: WinCipher ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            latest.json
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.exe.sig
