name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_INCREMENTAL: 0

jobs:
  release:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Verify or bump app version
        shell: pwsh
        run: |
          $tagVersion = "${{ github.ref_name }}" -replace '^v',''
          $pkgPath = "package.json"
          $tauriPath = "src-tauri/tauri.conf.json"
          $cargoPath = "src-tauri/Cargo.toml"

          $pkg = (Get-Content $pkgPath -Raw | ConvertFrom-Json).version
          $tauri = (Get-Content $tauriPath -Raw | ConvertFrom-Json).version
          $cargoMatch = Get-Content $cargoPath -Raw | Select-String '(?m)^version\s*=\s*"([^"]+)"'
          if (-not $cargoMatch) {
            throw "Could not read version from $cargoPath."
          }
          $cargo = $cargoMatch.Matches[0].Groups[1].Value

          if ($pkg -ne $tauri -or $pkg -ne $cargo) {
            throw "Version files disagree: package.json ($pkg), tauri.conf.json ($tauri), Cargo.toml ($cargo)."
          }

          foreach ($value in @($pkg, $tagVersion)) {
            if ($value -notmatch '^\d+\.\d+\.\d+$') {
              throw "Invalid version format '$value'. Expected major.minor.patch."
            }
          }

          if ($pkg -eq $tagVersion) {
            Write-Host "Version files already match v$tagVersion."
            exit 0
          }

          $current = [version]$pkg
          $target = [version]$tagVersion
          $isPatchBump = (($target.Major -eq $current.Major) -and ($target.Minor -eq $current.Minor) -and ($target.Build -eq ($current.Build + 1)))

          if (-not $isPatchBump) {
            throw "Tag v$tagVersion does not match version files ($pkg). Only an automatic one-patch bump is supported."
          }

          Write-Host "Version files are one patch behind. Bumping $pkg -> $tagVersion."

          $pkgContent = Get-Content $pkgPath -Raw
          $pkgContent = $pkgContent -replace '("version"\s*:\s*")[^"]+(")', ('${1}' + $tagVersion + '${2}')
          Set-Content $pkgPath -Value $pkgContent -Encoding utf8 -NoNewline

          $tauriContent = Get-Content $tauriPath -Raw
          $tauriContent = $tauriContent -replace '("version"\s*:\s*")[^"]+(")', ('${1}' + $tagVersion + '${2}')
          Set-Content $tauriPath -Value $tauriContent -Encoding utf8 -NoNewline

          $cargoContent = Get-Content $cargoPath -Raw
          $cargoContent = $cargoContent -replace '(?m)^(version\s*=\s*")[^"]+(")', ('${1}' + $tagVersion + '${2}')
          Set-Content $cargoPath -Value $cargoContent -Encoding utf8 -NoNewline

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and sign Tauri app
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm tauri build --bundles nsis,msi

      - name: Generate latest.json
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}" -replace '^v',''
          $exe = Get-ChildItem src-tauri/target/release/bundle/nsis/*-setup.exe |
                 Select-Object -First 1
          if (-not $exe) {
            throw "No NSIS installer found in src-tauri/target/release/bundle/nsis."
          }
          $signature = (Get-Content "$($exe.FullName).sig" -Raw).Trim()
          # GitHub renames spaces in uploaded asset names to dots.
          $assetName = $exe.Name -replace ' ', '.'
          $latest = [ordered]@{
            version = $version
            notes = "WinCipher $version"
            pub_date = [DateTime]::UtcNow.ToString("yyyy-MM-ddTHH:mm:ssZ")
            platforms = [ordered]@{
              "windows-x86_64" = [ordered]@{
                url = "https://github.com/${{ github.repository }}/releases/download/v$version/$assetName"
                signature = $signature
              }
            }
          }
          $latest | ConvertTo-Json -Depth 6 | Set-Content latest.json -Encoding utf8

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          name: WinCipher ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            latest.json
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.exe.sig
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/msi/*.msi.sig
